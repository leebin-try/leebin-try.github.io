nchor="start">Native 8B experts</text><rect x="700" y="300" width="420" height="110" rx="10" fill="#ecf1ed" stroke="#cddad9" stroke-width="2"/><text x="724" y="340" font-size="18" fill="#087f82" font-weight="600" text-anchor="start">03</text><text x="724" y="378" font-size="23" fill="#102b3b" font-weight="600" text-anchor="start">Character + word TF-IDF</text><rect x="390" y="465" width="420" height="110" rx="10" fill="#ecf1ed" stroke="#cddad9" stroke-width="2"/><text x="414" y="505" font-size="18" fill="#087f82" font-weight="600" text-anchor="start">04</text><text x="414" y="543" font-size="23" fill="#102b3b" font-weight="600" text-anchor="start">0.6 / 0.4 probability mix</text><text x="70" y="620" font-size="18" fill="#526c79" font-weight="400" text-anchor="start">Published experts and a separately fitted lexical head</text><text x="70" y="648" font-size="18" fill="#526c79" font-weight="400" text-anchor="start">27B feasibility was tested; it is not in the submitted mix</text></svg>