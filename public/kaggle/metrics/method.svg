<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="READ THE METRIC — method and validation boundaries">
<title>READ THE METRIC — method and validation boundaries</title><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="1200" height="675" fill="#f9faf7"/><text x="55" y="58" font-size="29" fill="#102b3b" font-weight="700" text-anchor="start">READ THE METRIC / METHOD MAP</text><text x="55" y="97" font-size="17" fill="#526c79" font-weight="400" text-anchor="start">Original explanation · arrows describe the protocol, not an executed trace</text><path d="M565 215 L625 215" fill="none" stroke="#087f82" stroke-width="3" stroke-dasharray=""/><path d="M613.0 209.0 L625 215 L613.0 221.0" fill="none" stroke="#087f82" stroke-width="3" stroke-linejoin="round"/><path d="M870 292 L870 345" fill="none" stroke="#087f82" stroke-width="3" stroke-dasharray=""/><path d="M876.0 333.0 L870 345 L864.0 333.0" fill="none" stroke="#087f82" stroke-width="3" stroke-linejoin="round"/><path d="M630 435 L565 435" fill="none" stroke="#087f82" stroke-width="3" stroke-dasharray=""/><path d="M577.0 441.0 L565 435 L577.0 429.0" fill="none" stroke="#087f82" stroke-width="3" stroke-linejoin="round"/><rect x="70" y="150" width="470" height="130" rx="10" fill="#ecf1ed" stroke="#cddad9" stroke-width="2"/><circle cx="105" cy="185" r="17" fill="#087f82" stroke="none" stroke-width="2"/><text x="105" y="192" font-size="20" fill="white" font-weight="600" text-anchor="middle">1</text><text x="100" y="232" font-size="24" fill="#102b3b" font-weight="600" text-anchor="start">Define the scored object</text><rect x="650" y="150" width="470" height="130" rx="10" fill="#ecf1ed" stroke="#cddad9" stroke-width="2"/><circle cx="685" cy="185" r="17" fill="#087f82" stroke="none" stroke-width="2"/><text x="685" y="192" font-size="20" fill="white" font-weight="600" text-anchor="middle">2</text><text x="680" y="232" font-size="24" fill="#102b3b" font-weight="600" text-anchor="start">Declare the stopping metric</text><rect x="70" y="370" width="470" height="130" rx="10" fill="#ecf1ed" stroke="#cddad9" stroke-width="2"/><circle cx="105" cy="405" r="17" fill="#087f82" stroke="none" stroke-width="2"/><text x="105" y="412" font-size="20" fill="white" font-weight="600" text-anchor="middle">4</text><text x="100" y="452" font-size="24" fill="#102b3b" font-weight="600" text-anchor="start">Separate official evidence</text><rect x="650" y="370" width="470" height="130" rx="10" fill="#ecf1ed" stroke="#cddad9" stroke-width="2"/><circle cx="685" cy="405" r="17" fill="#087f82" stroke="none" stroke-width="2"/><text x="685" y="412" font-size="20" fill="white" font-weight="600" text-anchor="middle">3</text><text x="680" y="452" font-size="24" fill="#102b3b" font-weight="600" text-anchor="start">Retain per-target diagnostics</text><path d="M60 548 L1140 548" fill="none" stroke="#cbd7d6" stroke-width="1" stroke-dasharray=""/><text x="70" y="590" font-size="19" fill="#526c79" font-weight="400" text-anchor="start">A flat metric is not proof of sufficient training</text><text x="70" y="622" font-size="19" fill="#526c79" font-weight="400" text-anchor="start">Different task scores are not a common quality scale</text></svg>