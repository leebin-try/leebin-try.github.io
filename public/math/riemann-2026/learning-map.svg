<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A prerequisite map with concrete reading goals">
<title>A prerequisite map with concrete reading goals</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#208980"/></marker></defs>
<style>text{font-family:Arial,sans-serif}</style><rect width="1200" height="675" fill="#f9faf7"/><text x="55" y="65" font-size="34" fill="#203029" font-weight="700">LEARN TOWARD A DELIVERABLE</text><rect x="55" y="110" width="515" height="130" rx="12" fill="#edf0e6"/><text x="77" y="155" font-size="25" fill="#208980" font-weight="700">REAL + LINEAR ANALYSIS</text><text x="77" y="202" font-size="22" fill="#203029" font-weight="400">limits, bounds, Gram determinants</text><rect x="630" y="110" width="515" height="130" rx="12" fill="#edf0e6"/><text x="652" y="155" font-size="25" fill="#208980" font-weight="700">COMPLEX ANALYSIS</text><text x="652" y="202" font-size="22" fill="#203029" font-weight="400">continuation, residues, transforms</text><rect x="55" y="280" width="515" height="130" rx="12" fill="#edf0e6"/><text x="77" y="325" font-size="25" fill="#208980" font-weight="700">NUMBER THEORY</text><text x="77" y="372" font-size="22" fill="#203029" font-weight="400">characters, prime powers, L(s, χ)</text><rect x="630" y="280" width="515" height="130" rx="12" fill="#edf0e6"/><text x="652" y="325" font-size="25" fill="#208980" font-weight="700">AUTOMORPHIC FORMS</text><text x="652" y="372" font-size="22" fill="#203029" font-weight="400">theta kernels and period integrals</text><rect x="55" y="450" width="515" height="130" rx="12" fill="#edf0e6"/><text x="77" y="495" font-size="25" fill="#208980" font-weight="700">ARITHMETIC GEOMETRY</text><text x="77" y="542" font-size="22" fill="#203029" font-weight="400">integrality, slopes, denominators</text><rect x="630" y="450" width="515" height="130" rx="12" fill="#edf0e6"/><text x="652" y="495" font-size="25" fill="#208980" font-weight="700">LEAN READING</text><text x="652" y="542" font-size="22" fill="#203029" font-weight="400">statements, dependencies, axioms</text><text x="55" y="650" font-size="22" fill="#607168" font-weight="400">Reading the architecture is a first milestone; checking every input is a different task.</text></svg>