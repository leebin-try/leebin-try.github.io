<title>Three lattice estimates lead to the main inequality and the critical line</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#208980"/></marker></defs>
<style>text{font-family:Arial,sans-serif}</style><rect width="1200" height="740" fill="#f9faf7"/><text x="55" y="60" font-size="34" fill="#203029" font-weight="700">THE MATHEMATICAL INTERFACES</text><rect x="50" y="105" width="320" height="118" rx="12" fill="#edf0e6"/><text x="70" y="150" font-size="29" fill="#208980" font-weight="700">A / SHORT</text><text x="70" y="195" font-size="22" fill="#203029" font-weight="400">norm + index control</text><rect x="440" y="105" width="320" height="118" rx="12" fill="#edf0e6"/><text x="460" y="150" font-size="29" fill="#208980" font-weight="700">B / ENOUGH</text><text x="460" y="195" font-size="22" fill="#203029" font-weight="400">many independent forms</text><rect x="830" y="105" width="320" height="118" rx="12" fill="#edf0e6"/><text x="850" y="150" font-size="29" fill="#208980" font-weight="700">C / LONG</text><text x="850" y="195" font-size="22" fill="#203029" font-weight="400">a covolume lower bound</text><path d="M210 230 L440 300" stroke="#208980" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M600 230 L600 300" stroke="#208980" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M990 230 L760 300" stroke="#208980" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="245" y="315" width="710" height="106" rx="12" fill="#dfeabf"/><text x="292" y="357" font-size="25" fill="#203029" font-weight="700">COMPARE THE SAME CORRECTED COVOLUME</text><text x="370" y="398" font-size="27" fill="#203029" font-weight="400">m · totalRemainder ≤ f a (log b)⁵</text><path d="M600 429 L600 468" stroke="#208980" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="100" y="482" width="1000" height="140" rx="12" fill="#edf0e6"/><text x="140" y="525" font-size="30" fill="#203029" font-weight="600">m ≍ √x  →  a one-sided prime-sum bound</text><text x="140" y="580" font-size="27" fill="#203029" font-weight="400">Landau + twists  →  no zeros to the right  →  symmetry</text><text x="55" y="696" font-size="22" fill="#607168" font-weight="400">Source interfaces: readable Lean rewriting, commit 72fead10; not a local kernel replay.</text></svg>