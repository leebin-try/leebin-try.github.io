<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Arithmetic, analysis and geometry meet through precise interfaces">
<title>Arithmetic, analysis and geometry meet through precise interfaces</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#208980"/></marker></defs>
<style>text{font-family:Arial,sans-serif}</style><rect width="1200" height="675" fill="#f9faf7"/><text x="55" y="65" font-size="34" fill="#203029" font-weight="700">ONE QUESTION, THREE LANGUAGES</text><rect x="50" y="145" width="320" height="300" rx="12" fill="#edf0e6"/><text x="72" y="200" font-size="29" fill="#208980" font-weight="700">ARITHMETIC</text><text x="72" y="265" font-size="22" fill="#203029" font-weight="400">prime powers</text><text x="72" y="323" font-size="22" fill="#203029" font-weight="400">Λ(n), characters</text><text x="72" y="381" font-size="22" fill="#203029" font-weight="400">weighted remainder</text><rect x="440" y="145" width="320" height="300" rx="12" fill="#edf0e6"/><text x="462" y="200" font-size="29" fill="#208980" font-weight="700">ANALYSIS</text><text x="462" y="265" font-size="22" fill="#203029" font-weight="400">logarithmic derivative</text><text x="462" y="323" font-size="22" fill="#203029" font-weight="400">Mellin / Laplace transform</text><text x="462" y="381" font-size="22" fill="#203029" font-weight="400">zeros become singularities</text><rect x="830" y="145" width="320" height="300" rx="12" fill="#edf0e6"/><text x="852" y="200" font-size="29" fill="#208980" font-weight="700">GEOMETRY</text><text x="852" y="265" font-size="22" fill="#203029" font-weight="400">integral structures</text><text x="852" y="323" font-size="22" fill="#203029" font-weight="400">norms and covolumes</text><text x="852" y="381" font-size="22" fill="#203029" font-weight="400">upper versus lower bounds</text><path d="M377 292 L426 292" stroke="#208980" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M817 292 L768 292" stroke="#208980" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="55" y="525" font-size="29" fill="#203029" font-weight="600">The bridge is an exact identity or a quantified inequality.</text><text x="55" y="585" font-size="24" fill="#607168" font-weight="400">A diagram explains dependencies; it does not replace the proof of a bridge.</text></svg>