<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A two-dimensional lattice illustrates index and squared covolume">
<title>A two-dimensional lattice illustrates index and squared covolume</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#208980"/></marker></defs>
<style>text{font-family:Arial,sans-serif}</style><rect width="1200" height="675" fill="#f9faf7"/><text x="55" y="65" font-size="34" fill="#203029" font-weight="700">A LATTICE YOU CAN CALCULATE</text><rect x="55" y="112" width="570" height="450" rx="12" fill="#edf0e6"/><path d="M115 150V520" stroke="#d7dfcf"/><path d="M175 150V520" stroke="#d7dfcf"/><path d="M235 150V520" stroke="#d7dfcf"/><path d="M295 150V520" stroke="#d7dfcf"/><path d="M355 150V520" stroke="#d7dfcf"/><path d="M415 150V520" stroke="#d7dfcf"/><path d="M475 150V520" stroke="#d7dfcf"/><path d="M535 150V520" stroke="#d7dfcf"/><path d="M595 150V520" stroke="#d7dfcf"/><path d="M95 160H600" stroke="#d7dfcf"/><path d="M95 220H600" stroke="#d7dfcf"/><path d="M95 280H600" stroke="#d7dfcf"/><path d="M95 340H600" stroke="#d7dfcf"/><path d="M95 400H600" stroke="#d7dfcf"/><path d="M95 460H600" stroke="#d7dfcf"/><path d="M95 520H600" stroke="#d7dfcf"/><rect x="175" y="220" width="120" height="180" fill="#cceb7d" fill-opacity=".65" stroke="#208980" stroke-width="3"/><circle cx="175" cy="220" r="7" fill="#208980"/><circle cx="175" cy="400" r="7" fill="#208980"/><circle cx="295" cy="220" r="7" fill="#208980"/><circle cx="295" cy="400" r="7" fill="#208980"/><circle cx="415" cy="220" r="7" fill="#208980"/><circle cx="415" cy="400" r="7" fill="#208980"/><circle cx="535" cy="220" r="7" fill="#208980"/><circle cx="535" cy="400" r="7" fill="#208980"/><path d="M175 400 L295 400" stroke="#208980" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M175 400 L175 220" stroke="#208980" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="205" y="440" font-size="27" fill="#203029" font-weight="400">2 e₁</text><text x="105" y="310" font-size="27" fill="#203029" font-weight="400">3 e₂</text><text x="680" y="170" font-size="31" fill="#203029" font-weight="600">L = Z²</text><text x="680" y="235" font-size="31" fill="#203029" font-weight="600">L′ = 2Z × 3Z</text><text x="680" y="300" font-size="31" fill="#203029" font-weight="600">index [L : L′] = 6</text><text x="680" y="365" font-size="31" fill="#203029" font-weight="600">covolume(L′) = 6</text><text x="680" y="430" font-size="31" fill="#203029" font-weight="600">det(Gram) = 36</text><text x="55" y="625" font-size="28" fill="#607168" font-weight="400">Finite index I changes log squared covolume by 2 log I.</text></svg>